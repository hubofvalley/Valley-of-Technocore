name: Node CI — Compatibility & Test Suite

run-name: ${{ github.event_name }} · Node compatibility & test suite

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check local release contract
        if: github.event_name != 'release'
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          archive_dir="${RUNNER_TEMP}/valley-release-contract"
          archive_name="valley-of-technocore-v${package_version}.tar"
          mkdir -p "$archive_dir"
          git archive --format=tar --prefix="valley-of-technocore-v${package_version}/" HEAD > "$archive_dir/$archive_name"
          (cd "$archive_dir" && sha256sum "$archive_name" > "$archive_name.sha256")
          contract_mode='local'
          if [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            contract_mode='candidate'
          fi
          npm run check-release-contract -- \
            --mode "$contract_mode" \
            --archive "$archive_dir/$archive_name"

      - name: Check published release contract
        if: github.event_name == 'release'
        run: npm run check-release-contract
        env:
          GH_TOKEN: ${{ github.token }}

  node-test-suite:
    name: Node ${{ matrix.node-version }} · Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
