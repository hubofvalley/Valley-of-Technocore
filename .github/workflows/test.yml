name: Node CI — Compatibility & Test Suite

run-name: ${{ github.event_name }} · Node compatibility & test suite

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Check release contract
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            archive_dir="${RUNNER_TEMP}/valley-release-contract"
            archive_name="valley-of-technocore-v${package_version}.tar"
            mkdir -p "$archive_dir"
            git archive --format=tar --prefix="valley-of-technocore-v${package_version}/" HEAD > "$archive_dir/$archive_name"
            (cd "$archive_dir" && sha256sum "$archive_name" > "$archive_name.sha256")
            npm run check-release-contract -- \
              --mode candidate \
              --archive "$archive_dir/$archive_name"
          else
            npm run check-release-contract
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  node-test-suite:
    name: Node ${{ matrix.node-version }} · Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
